name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.6"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r25b
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b
          link-to-sdk: true

      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status

      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p "$ANDROID_HOME/ndk"
          # env_ndk.sh prefers ANDROID_HOME/ndk/25.0.8775105
          ln -sfn "${{ steps.setup-ndk.outputs.ndk-path }}" "$ANDROID_HOME/ndk/25.0.8775105"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          chmod +x run libcore/*.sh buildScript/**/*.sh || true
          ./run lib core

      - name: Upload libcore.aar
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs: [libcore]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download libcore.aar
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}

      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          KEYSTORE_PASS: android
          ALIAS_NAME: androiddebugkey
          ALIAS_PASS: android
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x run gradlew buildScript/**/*.sh || true
          ./run init action gradle
          ./gradlew app:assembleOssRelease --no-daemon --stacktrace
          APK_DIR=$(dirname "$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -n1)")
          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"
          ls -la "$APK_DIR"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NekoBox-APKs
          path: ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error
