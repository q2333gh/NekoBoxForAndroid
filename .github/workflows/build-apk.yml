name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_HOME: /home/runner/android-sdk
  NDK_VERSION: 25.0.8775105

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.6"
          cache: false

      - name: Install Android SDK / NDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          SM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install \
            "ndk;${NDK_VERSION}" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "platform-tools"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status

      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}

      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> local.properties
          chmod +x run
          find buildScript libcore -name '*.sh' -exec chmod +x {} +
          ./run lib core

      - name: Upload libcore.aar
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          if-no-files-found: error

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs: [libcore]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          SM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "platform-tools"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

      - name: Download libcore.aar
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}

      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          KEYSTORE_PASS: android
          ALIAS_NAME: androiddebugkey
          ALIAS_PASS: android
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x run gradlew
          find buildScript -name '*.sh' -exec chmod +x {} +
          ./run init action gradle
          ./gradlew app:assembleOssRelease --no-daemon --stacktrace
          APK_DIR=$(dirname "$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -n1)")
          echo "APK_DIR=$APK_DIR" >> "$GITHUB_ENV"
          ls -la "$APK_DIR"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NekoBox-APKs
          path: ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error
